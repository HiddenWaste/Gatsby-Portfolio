version: "3.8"

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gatsby-portfolio
    restart: unless-stopped
    ports:
      - "${PORT:-8070}:80"
    environment:
      - NODE_ENV=production
    labels:
      - "app=gatsby-portfolio"
      - "maintainer=Carter Gordon"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
